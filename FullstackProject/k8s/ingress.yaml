apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fullstack-ingress
  namespace: fullstack-app
spec:
  ingressClassName: nginx
  rules:
    - host: jumana-fullstack.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /customers
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
